[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "yt-prompt-scraper"
version = "1.0.0"
description = "Automated tool and prompt suite to scrape YouTube playlist transcripts with line-by-line formatting, auto-resume, and anti-ban rate limiting."
readme = "README.md"
authors = [
  { name = "Vinit K", email = "vinitcalpha@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = [
    "youtube-transcript-api>=1.2.0",
    "yt-dlp>=2024.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
browser = [
    "playwright>=1.40.0",
]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
yt-prompt = "yt_prompt.cli:main"
yt-scraper = "yt_prompt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
